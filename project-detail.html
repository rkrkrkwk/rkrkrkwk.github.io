<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 상세 정보</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e3e3e3;
            --text-sub: #a0a0a0;
            --border-color: #333333;
            --accent-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        a {
            color: var(--text-sub);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--text-main);
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px;
        }

        nav {
            padding: 25px 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .project-detail-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 6px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .detail-section {
            margin-bottom: 25px;
        }

        .detail-section h3 {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .detail-section p, .detail-section ul {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .detail-section ul {
            list-style-type: square;
            padding-left: 20px;
        }

        .detail-section li {
            margin-bottom: 6px;
        }

        .detail-section strong {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <nav>
            <a href="index.html" class="back-link">&larr; 메인으로 돌아가기</a>
        </nav>

        <div class="project-detail-card">
            <h1>1인 개발 RPG 프로젝트 상세</h1>

            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/여기에_유튜브_영상_ID" title="Project Play Video" allowfullscreen></iframe>
            </div>

            <div class="detail-section">
                <h3>프로젝트 개요</h3>
                <p>(프로젝트에 대한 전반적인 소개를 자유롭게 적어주세요.)</p>
            </div>

            <div class="detail-section">
                <h3>인벤토리 시스템</h3>
                <ul>
                    <li>상세 설명</li>
                </ul>
            </div>
            <div class="detail-section">
                <h3>스탯 시스템</h3>
                <ul>
                    <li>상세 설명</li>
                </ul>
            </div>
            <div class="detail-section">
                <h3>스킬 시스템</h3>
                <ul>
                    <li>상세 설명</li>
                </ul>
            </div>
            <div class="detail-section">
                <h3>아이템 시스템</h3>
                <ul>
                    <li>상세 설명</li>
                </ul>
            </div>
            <div class="detail-section">
                <h3>장비 시스템</h3>
                <ul>
                    <li>상세 설명</li>
                </ul>
            </div>
        </div>
    </div>

</body>
</html>
