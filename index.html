<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity 개발자 포트폴리오 | 1인 개발 프로젝트</title>
    <style>
        /* 기본 리셋 및 스타일 변수 설정 */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--accent-hover);
        }

        /* 레이아웃 컨테이너 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 헤더 / 히어로 섹션 */
        header {
            padding: 80px 0 40px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .role-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .header-bio {
            color: var(--text-sub);
            font-size: 1.1rem;
            max-width: 700px;
            margin-bottom: 25px;
        }

        .social-links {
            display: flex;
            gap: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--border-color);
            color: #fff;
        }

        .btn-primary {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        /* 섹션 공통 */
        section {
            padding: 50px 0;
            border-bottom: 1px solid var(--border-color);
        }
