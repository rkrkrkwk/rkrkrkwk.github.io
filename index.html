<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #292929;
            --text-main: #e3e3e3;
            --text-sub: #a0a0a0;
            --border-color: #333333;
            --accent-color: #ffffff;
            --button-bg: #2d2d2d;
            --button-hover: #3d3d3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        a {
            color: var(--text-main);
            text-decoration: none;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 헤더 / 프로필 */
        header {
            padding: 50px 0 30px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .role-badge {
            display: inline-block;
            background: var(--button-bg);
            color: var(--text-sub);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }

        .profile-card h3 {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .profile-item {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .profile-item strong {
            color: var(--text-main);
            display: inline-block;
            width: 65px;
        }

        .social-links {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--button-bg);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--button-hover);
        }

        /* 섹션 */
        section {
            padding: 35px 0;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        /* 프로젝트 카드 */
        .project-link-card {
            display: block;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: background 0.2s, border-color 0.2s;
        }

        .project-link-card:hover {
            background: var(--card-hover);
            border-color: #555555;
        }

        .project-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .project-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .arrow-icon {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .system-list {
            list-style: none;
            margin-top: 10px;
        }

        .system-list li {
            position: relative;
            padding-left: 16px;
            margin-bottom: 6px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .system-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--text-sub);
        }

        .system-list strong {
            color: var(--text-main);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>포트폴리오</h1>

            <div class="profile-card">
                <h3>Profile</h3>
                <div class="profile-grid">
                    <div class="profile-item"><strong>이름</strong> 홍길동</div>
                    <div class="profile-item"><strong>이메일</strong> example@email.com</div>
                    <div class="profile-item"><strong>연락처</strong> 010-0000-0000</div>
                    <div class="profile-item"><strong>기술 스택</strong> Unity, C#, Git</div>
                </div>
            </div>

            <div class="social-links">
                <a href="https://github.com/" target="_blank" class="btn">
                    GitHub Repository
                </a>
            </div>
        </header>

        <section id="project">
            <h2 class="section-title">프로젝트 목록</h2>
            
            <a href="project-detail.html" class="project-link-card">
                <div class="project-card-header">
                    <h3 class="project-title">1인 개발 RPG 프로젝트</h3>
                    <span class="arrow-icon">상세보기 &rarr;</span>
                </div>
                
                <ul class="system-list">
                    <li>프로젝트에 대한 간단한 설명</li>
                </ul>
            </a>
        </section>

        <footer>
            <p>© Portfolio. Dark Theme.</p>
        </footer>
    </div>

</body>
</html>
